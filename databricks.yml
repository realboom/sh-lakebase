# Databricks Asset Bundle for the Select Health Lakebase environment.
# Defines the Lakebase Autoscaling project (+ branch/endpoint), the `sh_is_lakebase`
# database registered into Unity Catalog, and synced tables that replicate UC source
# tables into the epic_census / pdax_quality Postgres schemas.
#
# Usage:
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev      # provisions the project + catalog + synced tables
#
# Fresh-start flow (no pre-existing project):
#   databricks bundle deploy -t dev          # creates the project, the sh_is_lakebase
#                                            # database (UC catalog), and the synced tables
#   databricks bundle run setup_dataapi_role -t dev   # grants the Data API SP on the database
#
# WARNING: do NOT change immutable project fields (project_id, pg_version) once the
# project exists — DABs cannot replace a Lakebase project in place (it tries to
# recreate and fails on the locked id). To change them, delete the project first.

bundle:
  name: sh-lakebase

include:
  - resources/*.yml
  # Also pick up value-stream subfolders (e.g. resources/finance/lakebase_risk.yml).
  # DABs include globs are NOT recursive, so each nesting level needs its own pattern.
  - resources/*/*.yml

variables:
  # NOTE: per-instance identity (project_id/slug, display_name, catalog stem) is
  # HARDCODED inside each resources/lakebase_proj_<x>.yml — NOT shared here — so a
  # new instance is just a copied file. Only ENV-varying values live below.
  # Standard UC catalog + schema where the synced-table PIPELINES store their internal
  # checkpoints/event logs (NOT the synced data — that goes to the Postgres database /
  # pg_catalog_id). Must be a standard catalog the deploy identity can create tables in,
  # and the schema must exist. Per-target: dev default is this FEVM test workspace's
  # writable catalog; set to the customer's medallion catalog (e.g. dev_sh_bronze) per env.
  pg_storage_catalog:
    description: UC catalog for synced-table pipeline checkpoints/logs
    # A standard UC catalog the deploy identity can create tables in. Set per env
    # (e.g. the customer's medallion catalog such as dev_sh_bronze).
    default: <your-dev-storage-catalog>
  pg_storage_schema:
    description: Schema under pg_storage_catalog for pipeline state
    default: default
  # Cost-attribution tag value, per target. Flows to system.billing.usage.custom_tags so
  # the Account Usage Dashboard can break spend down by environment.
  environment:
    description: environment tag value (dev/prod)
    default: dev

# Tags applied to all taggable resources that support presets (the serverless JOBS here).
# The Lakebase project carries its own custom_tags (resources/lakebase_proj_a.yml).
presets:
  tags:
    project: sh-lakebase
    environment: ${var.environment}
    cost_center: data-architecture
    managed_by: dabs

  # NOTE: prod is deployed/run/managed as the operator (no SP run_as, no group ACLs).
  # Those need stable, workspace-bound identities that FEVM workspaces don't provide:
  # - SP run_as needs the deployer to hold `servicePrincipal.user` on a per-cycle SP
  # - group ACLs need the groups to be workspace-bound; lakebase-* are account-level and
  #   the prod workspace permissions API can't bind them ("group does not exist")
  # The `lakebase-deploy` SP still exists (bootstrap) and powers the Data API via the
  # secret scope. Restore full governance only for a long-lived (non-FEVM) prod + CI.

targets:
  # Dev = the westus2 workspace (has Azure portal + account console access).
  dev:
    mode: development
    default: true
    workspace:
      # Set this to your dev Azure Databricks workspace URL.
      # Nothing else is workspace-pinned (workspace id + endpoint host are derived at
      # runtime by the notebooks).
      host: https://<your-dev-workspace>.azuredatabricks.net

  # Prod = the production workspace. mode: production disables name-prefixing and
  # forces an explicit, deterministic deploy. Never the default target, so prod is
  # only ever touched with an explicit `-t prod`.
  prod:
    mode: production
    variables:
      pg_storage_catalog: prod_sh_bronze        # customer prod medallion catalog
      environment: prod                         # also the catalog prefix (prod_sh_lakebase_is_proj_*)
    workspace:
      host: https://adb-7405616852753670.10.azuredatabricks.net
      # Deterministic single deploy location (prod mode requires an explicit root_path).
      # /Workspace/Shared is writable by the deployer (validate warns world-writable —
      # acceptable for this operator-run prod).
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

