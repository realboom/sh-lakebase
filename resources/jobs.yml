# =============================================================================
# Shared, REUSABLE Lakebase ops jobs — created ONCE, run per-instance with params.
# =============================================================================
# These are NOT per-instance. One copy of each job serves every Lakebase instance;
# you pass the target instance's values at RUN time via job parameters, e.g.:
#
#   databricks bundle run setup_dataapi_role -t dev \
#     --params project_id=sh-lakebase-is-proj-c,database=sh_is_lakebase,secret_scope=sh-lakebase
#
# The notebooks read these via dbutils.widgets.get(...). Job-level `parameters`
# below define the names + defaults; --params overrides them at run time.
#
# This replaces the old per-instance proj_<x>_* jobs (which multiplied 3x per
# instance and cluttered the workspace). Instance files (lakebase_proj_<x>.yml)
# now declare ONLY the project (+ catalog if used) — not jobs.
# -----------------------------------------------------------------------------

resources:
  jobs:
    setup_dataapi_role:
      name: "[SH Lakebase] Setup Data API role (grant SP)"
      # No defaults on project/database — the notebook fails fast if blank.
      parameters:
        - name: project_id
          default: ""
        - name: database
          default: ""
        # PRIMARY: SP application id, passed directly (sourced from the project's
        # permissions block by the pre-hook — no secret scope needed).
        - name: identity
          default: ""
        # LEGACY FALLBACK (original repo): secret-scope source for the SP id. Used only
        # if `identity` is blank. Kept for backward compat.
        - name: secret_scope
          default: ""
        - name: client_id_key
          default: sp_client_id
      tasks:
        - task_key: setup_role
          notebook_task:
            notebook_path: ../src/setup_dataapi_role.py

    # Grant an identity DIRECT-CONNECTION Postgres data access (role + table DML), derived
    # from a project's `permissions:` block by the post-hook. NOT the Data API path — does
    # not grant TO authenticator, so needs no "Enable Data API". Post-hook passes privileges
    # per identity type (SP -> RW, USER -> RO).
    setup_data_role:
      name: "[SH Lakebase] Setup data role (direct-connection grant)"
      parameters:
        - name: project_id
          default: ""
        - name: database
          default: ""
        - name: identity          # SP application id (UUID) or user email
          default: ""
        - name: identity_type     # SERVICE_PRINCIPAL | USER | GROUP
          default: ""
        - name: privileges        # comma-sep: SELECT[,INSERT,UPDATE,DELETE]
          default: SELECT
      tasks:
        - task_key: setup_data_role
          notebook_task:
            notebook_path: ../src/setup_data_role.py

    setup_synced_table_grants:
      name: "[SH Lakebase] Grant read on synced-table schemas"
      # project_id/database: no default (fail fast). schemas: real default. grant_to: blank=current user.
      parameters:
        - name: project_id
          default: ""
        - name: database
          default: ""
        - name: schemas
          default: epic_census,pdax_quality
        - name: grant_to
          default: ""
      tasks:
        - task_key: grant_read
          notebook_task:
            notebook_path: ../src/setup_synced_table_grants.py

    dataapi_examples:
      name: "[SH Lakebase] Data API examples (PostgREST over HTTP)"
      # No default on identity params — notebook fails fast if blank.
      parameters:
        - name: project_id
          default: ""
        - name: database
          default: ""
        - name: secret_scope
          default: ""
      tasks:
        - task_key: dataapi
          notebook_task:
            notebook_path: ../src/dataapi_examples.py
