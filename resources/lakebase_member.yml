# =============================================================================
# Lakebase instance: member  (SELF-CONTAINED per-instance definition)
# =============================================================================
# ONE file = ONE Lakebase instance and everything it owns: the autoscaling
# project + its UC catalog registration + synced tables + refresh job.
#
# NAMING (new convention):
#   • Instance  : dev-sh-lkb-member   (hyphens — DNS-safe; ${var.environment} prefix)
#   • UC catalog: dev_sh_lkb_member   (underscores; stream-scoped so it can't collide
#                 with another value stream's catalog)
#   The instance is the compute/isolation boundary; databases are the apps.
#
# DESIGN (for now): registers the default databricks_postgres DB as one UC catalog
# and syncs a placeholder system table into it (swap for real member/eligibility
# sources later).
#
# LIFECYCLE: handled by scripts/lakebase_prehook.py (create-legacy + bind), then
# `bundle deploy`. See the repo README / prehook for details.
#
# WARNING: project_id and pg_version are immutable after creation.
# =============================================================================

resources:

  # ---- The autoscaling project (the instance / compute boundary) ----
  postgres_projects:
    sh_lkb_member:
      project_id: ${var.environment}-sh-lkb-member
      display_name: SH Lakebase member (${var.environment})
      pg_version: 17            # immutable after creation
      custom_tags:
        - key: project
          value: ${var.environment}-sh-lkb-member
        - key: environment
          value: ${var.environment}
        - key: cost_center
          value: data-architecture
        - key: managed_by
          value: dabs
        - key: value_stream
          value: member
        # Data API wiring: scope derived per env as kv-sh-ent-dpa-${environment};
        # this is the vault KEY NAME inside that scope for THIS stream's SP client id.
        - key: dataapi_client_id_key
          value: kv-sp-member-client-id

  # ---- UC catalog: register the default databricks_postgres DB (stream-scoped id) ----
  postgres_catalogs:
    sh_lkb_member_catalog:
      catalog_id: ${var.environment}_sh_lkb_member
      postgres_database: databricks_postgres
      branch: ${resources.postgres_projects.sh_lkb_member.id}/branches/production
      # false: databricks_postgres is the default, auto-provisioned DB — register, don't create.
      create_database_if_missing: false

  # ---- Synced tables (placeholder system source; swap for real member tables) ----
  postgres_synced_tables:
    member_audit:
      synced_table_id: ${resources.postgres_catalogs.sh_lkb_member_catalog.catalog_id}.public.audit
      source_table_full_name: system.access.audit
      postgres_database: databricks_postgres
      branch: ${resources.postgres_projects.sh_lkb_member.id}/branches/production
      primary_key_columns:
        - event_id
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.pg_storage_catalog}
        storage_schema: ${var.pg_storage_schema}

  # ---- Scheduled refresh (job KEY must be stream-unique — bundle-global namespace) ----
  jobs:
    member_refresh_snapshots:
      name: "[SH Lakebase] Refresh member snapshots (${var.environment})"
      schedule:
        quartz_cron_expression: "0 0 9 * * ?"
        timezone_id: America/Denver
        pause_status: UNPAUSED
      tasks:
        - task_key: audit
          pipeline_task:
            pipeline_id: ${resources.postgres_synced_tables.member_audit.status.pipeline_id}
