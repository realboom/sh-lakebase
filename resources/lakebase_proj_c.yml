# =============================================================================
# Lakebase instance: proj-c  (per-instance definition)
# =============================================================================
# ONE file = ONE Lakebase instance's DECLARATION (the autoscaling project, and a
# UC catalog + synced tables if you use them). Ops JOBS are NOT here — they are
# shared/reusable in resources/jobs.yml and run per-instance with --params.
#
# To add another instance: COPY this file to lakebase_proj_<x>.yml and replace
# the per-instance tokens (hardcoded, NOT shared variables):
#   • resource key:    sh_lakebase_proj_c   -> sh_lakebase_proj_<x>
#   • slug/project_id: sh-lakebase-is-proj-c -> sh-lakebase-is-proj-<x>
#   • display_name / tag values
#
# LIFECYCLE (create via CLI, then adopt — see runbook):
#   1. databricks database create-database-instance sh-lakebase-is-proj-c --capacity CU_1
#   2. databricks bundle deployment bind sh_lakebase_proj_c projects/sh-lakebase-is-proj-c -t <target>
#   3. databricks bundle deploy -t <target>
#   4. PATCH the primary endpoint to the 0.5->2 CU window (DABs can't; see runbook)
#   5. (manual) Enable Data API in UI, then run the shared setup_dataapi_role job:
#        databricks bundle run setup_dataapi_role -t <target> \
#          --params project_id=sh-lakebase-is-proj-c,database=sh_is_lakebase,secret_scope=sh-lakebase
# =============================================================================

resources:
  postgres_projects:
    sh_lakebase_proj_c:
      project_id: sh-lakebase-is-proj-c
      display_name: SH Lakebase IS proj-c
      pg_version: 17            # immutable after creation
      custom_tags:
        - key: project
          value: sh-lakebase-is-proj-c
        - key: environment
          value: ${var.environment}
        - key: cost_center
          value: data-architecture
        - key: managed_by
          value: dabs
