# =============================================================================
# Lakebase instance: proj-b  (SELF-CONTAINED per-instance definition)
# =============================================================================
# ONE file = ONE Lakebase instance and everything it owns: the autoscaling
# project, its UC catalog, its synced tables, and its Data API jobs.
#
# To add another instance: COPY this file to lakebase_proj_<x>.yml and replace
# the per-instance tokens (all hardcoded here, NOT shared variables):
#   • resource keys:  sh_lakebase_proj_b  -> sh_lakebase_proj_<x>
#   • slug/project_id: sh-lakebase-is-proj-b -> sh-lakebase-is-proj-<x>
#   • catalog stem:    sh_lakebase_is_proj_b -> sh_lakebase_is_proj_<x>
#   • display_name / tag values
# Only ENV-varying values stay as ${var.*} (environment, storage catalog/schema).
#
# LIFECYCLE (this instance is CREATED via CLI first, then adopted — see runbook):
#   1. databricks database create-database-instance sh-lakebase-is-proj-b --capacity CU_1
#   2. databricks bundle deployment bind sh_lakebase_proj_b projects/sh-lakebase-is-proj-b -t <target>
#   3. databricks bundle deploy -t <target>
#   4. PATCH the primary endpoint to the 0.5->2 CU window (DABs can't; see runbook)
# Adding synced tables later = edit this file + `bundle deploy` (no create/bind).
# =============================================================================

resources:

  # ---- The autoscaling project (bound to the CLI-created backend) ----
  postgres_projects:
    sh_lakebase_proj_b:
      project_id: sh-lakebase-is-proj-b
      display_name: SH Lakebase IS proj-b
      pg_version: 17            # immutable after creation
      # custom_tags: CONFIRMED NO-OP through CLI v1.5.0 (validates/deploys but not applied;
      # get-project returns custom_tags: null). Kept as intent. For real cost attribution
      # use a budget/usage policy + budget_policy_id. (Job-level tags DO apply.)
      custom_tags:
        - key: project
          value: sh-lakebase-is-proj-b
        - key: environment
          value: ${var.environment}
        - key: cost_center
          value: data-architecture
        - key: managed_by
          value: dabs

  # ---- UC catalog: registers the Postgres database into Unity Catalog ----
  # catalog name is per-instance AND per-env (dev/prod share a metastore, so the
  # env prefix keeps them distinct). Composed from the shared `environment` var.
  postgres_catalogs:
    sh_lakebase_proj_b_catalog:
      catalog_id: ${var.environment}_sh_lakebase_is_proj_b
      postgres_database: sh_is_lakebase
      branch: ${resources.postgres_projects.sh_lakebase_proj_b.id}/branches/production
      create_database_if_missing: true

  # ---- Synced tables (UC Delta source -> Postgres, continuous replication) ----
  # {catalog} references the postgres_catalogs resource (not a var) ON PURPOSE:
  # the ${resources...} edge makes DABs create catalog+database BEFORE the synced
  # tables so a fresh deploy succeeds in one pass (a plain var races -> CATALOG_DOES_NOT_EXIST).
  postgres_synced_tables:
    # ---- schema: epic_census ----
    proj_b_epic_census_billing_usage:
      synced_table_id: ${resources.postgres_catalogs.sh_lakebase_proj_b_catalog.catalog_id}.epic_census.billing_usage
      source_table_full_name: system.billing.usage
      postgres_database: sh_is_lakebase
      branch: ${resources.postgres_projects.sh_lakebase_proj_b.id}/branches/production
      primary_key_columns:
        - record_id
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.pg_storage_catalog}
        storage_schema: ${var.pg_storage_schema}

    proj_b_epic_census_node_types:
      synced_table_id: ${resources.postgres_catalogs.sh_lakebase_proj_b_catalog.catalog_id}.epic_census.node_types
      source_table_full_name: system.compute.node_types
      postgres_database: sh_is_lakebase
      branch: ${resources.postgres_projects.sh_lakebase_proj_b.id}/branches/production
      primary_key_columns:
        - node_type
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.pg_storage_catalog}
        storage_schema: ${var.pg_storage_schema}

    # ---- schema: pdax_quality ----
    proj_b_pdax_quality_query_history:
      synced_table_id: ${resources.postgres_catalogs.sh_lakebase_proj_b_catalog.catalog_id}.pdax_quality.query_history
      source_table_full_name: system.query.history
      postgres_database: sh_is_lakebase
      branch: ${resources.postgres_projects.sh_lakebase_proj_b.id}/branches/production
      primary_key_columns:
        - statement_id
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.pg_storage_catalog}
        storage_schema: ${var.pg_storage_schema}

    proj_b_pdax_quality_audit:
      synced_table_id: ${resources.postgres_catalogs.sh_lakebase_proj_b_catalog.catalog_id}.pdax_quality.audit
      source_table_full_name: system.access.audit
      postgres_database: sh_is_lakebase
      branch: ${resources.postgres_projects.sh_lakebase_proj_b.id}/branches/production
      primary_key_columns:
        - event_id
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.pg_storage_catalog}
        storage_schema: ${var.pg_storage_schema}

  # NOTE: ops jobs (setup_dataapi_role, setup_synced_table_grants, dataapi_examples)
  # are NOT declared here anymore — they are shared/reusable in resources/jobs.yml and
  # run per-instance with --params (e.g. --params project_id=sh-lakebase-is-proj-b,...).
