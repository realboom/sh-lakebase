name: Databricks DABs CI/CD

# Model:
#   - Pull request  -> validate dev (cheap, safe; no deploy). Developers deploy `dev`
#     locally as themselves (`databricks bundle deploy -t dev`). CI does not deploy dev
#     (mode:development is per-user; CI's SP has no /Workspace/Users/<sp> home).
#   - Merge to main -> deploy `prod` (CI authenticates AS the prod deploy SP).
#   - Manual dispatch -> onboard / update a Lakebase instance, with a CONDITIONAL
#     "create new provisioned instance" step (see the onboard-lakebase job).
#
# Auth: Entra ID (Azure AD) service principal — azure-client-secret. Per-environment
# GitHub Environments hold creds:
#   vars:    DATABRICKS_HOST, ARM_TENANT_ID
#   secrets: DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET
#            (these hold the ENTRA SP's app-registration client id + secret — the
#             CI/CD service principal's values).
# NOTE ON NAMING: the GitHub SECRET names are DATABRICKS_CLIENT_ID/SECRET (matching the
# client's convention), but they are mapped into ARM_CLIENT_ID / ARM_CLIENT_SECRET at the
# env/profile level on purpose. The Databricks CLI auto-detects auth from env vars, and
# `DATABRICKS_CLIENT_ID`/`SECRET` as *env vars* would select OAUTH-M2M (wrong for an Entra
# SP). Exposing them as ARM_* selects azure-client-secret (the Entra/MSAL path).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual trigger. Provisioning/create/bind is now automatic (the Python pre-hook
  # reads every project from resources/lakebase_*.yml), so no instance/capacity
  # inputs are needed. Only two knobs remain:
  workflow_dispatch:
    inputs:
      target:
        description: "DABs target"
        type: choice
        options: [dev, prod]
        default: dev
      run_data_api_grants:
        description: "Enable Data API grants? (check ONLY after you have manually clicked 'Enable Data API' on the target instance in the UI — that step creates the authenticator role the grants need)"
        type: boolean
        default: false
      data_api_project_id:
        description: "Data API: target ONE project_id (e.g. dev-sh-lkb-risk). Leave BLANK to grant every project in the bundle. Databases + schemas are DERIVED (from postgres_catalogs + the live DB) — you don't enter them."
        type: string
        default: ""
      # NOTE (2026-08-05): per-developer grants are currently DISABLED — only the
      # SH_ENTERPRISE_ADMIN group is granted (universal). Developer UC/superuser
      # access is deferred pending a client conversation on the access model.
      # vars.DATABRICKS_EMAIL_DOMAIN is unused until then.

permissions:
  contents: read

jobs:
  # ---- PR safety gate: validate dev only ----
  validate-dev:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    environment: dev
    # Entra SP auth: map the DATABRICKS_CLIENT_* secrets into ARM_* env vars so the CLI
    # selects azure-client-secret (not oauth-m2m). See the naming note in the header.
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      ARM_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev

  # ---- Merge to main: auto-deploy prod (steady state; NO create/bind) ----
  # DISABLED 2026-07-25: no live prod workspace yet (the FEVM prod host is down and
  # the prod GitHub env creds are stale), so this fired red on every merge. Re-enable
  # once the `prod` GitHub environment points at a stable workspace with fresh SP creds.
  # deploy-prod:
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   runs-on: self-hosted
  #   environment: prod               # add required reviewers on this env to gate prod
  #   concurrency: deploy-prod
  #   env:
  #     DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  #     ARM_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  #     ARM_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  #     ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: databricks/setup-cli@main
  #     - name: Validate prod
  #       run: databricks bundle validate -t prod
  #     - name: Deploy prod
  #       run: databricks bundle deploy -t prod

  # ---- Manual: onboard + reconcile all Lakebase value streams ----
  # The Python pre-hook auto-creates/binds any missing instance (from every
  # resources/lakebase_*.yml), deploy reconciles catalogs/synced tables/jobs, then
  # the post phase sets autoscale. Data API grants run only if the box is checked.
  onboard-lakebase:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: ${{ inputs.target }}   # binds creds + (for prod) approval gate to the chosen target
    concurrency: onboard-${{ inputs.target }}
    # NOTE: NO job-level DATABRICKS_* env block. Auth is done entirely through the
    # `gh-actions` profile written below — env vars would OVERRIDE the profile
    # (env wins over .databrickscfg) and cause silent auth-source confusion.
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main

      # --- Auth: write the `gh-actions` CLI profile ---
      # Every step below authenticates with `--profile gh-actions`. Entra ID (Azure AD)
      # service principal via azure-client-secret. The profile NAME stays `gh-actions`
      # so nothing downstream changes.
      #   • This is the Entra ID (Azure AD) app-registration service principal for CI/CD.
      #   • To swap to Managed Identity later, replace azure_client_secret with
      #     `azure_use_msi = true` (keep azure_client_id + azure_tenant_id).
      - name: Set up Databricks CLI authentication (Entra service principal)
        shell: bash
        run: |
          # Fail fast if any credential is missing/empty. Without this guard a blank
          # client_id lets the CLI fall back to a cached U2M (human) token on the
          # self-hosted runner — which silently creates resources AS the runner's user
          # instead of the SP (this bit us: devtest3 got creator=clint.whetten).
          if [ -z "${{ secrets.DATABRICKS_CLIENT_ID }}" ] || [ -z "${{ secrets.DATABRICKS_CLIENT_SECRET }}" ] || [ -z "${{ vars.ARM_TENANT_ID }}" ]; then
            echo "::error::DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET (secrets) and ARM_TENANT_ID (var) must all be set in the '${{ inputs.target }}' GitHub Environment."
            exit 1
          fi
          mkdir -p ~/.databricks
          # SECRET names are DATABRICKS_CLIENT_ID/SECRET (client convention) but they carry
          # the ENTRA SP's app-registration id/secret and are written into the azure_*
          # profile keys -> auth_type=azure-client-secret (the Entra/MSAL path).
          cat > ~/.databrickscfg <<EOF
          [gh-actions]
          host              = ${{ vars.DATABRICKS_HOST }}
          azure_client_id     = ${{ secrets.DATABRICKS_CLIENT_ID }}
          azure_client_secret = ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          azure_tenant_id     = ${{ vars.ARM_TENANT_ID }}
          auth_type         = azure-client-secret
          EOF
          # (Do NOT `cat` the file — azure_client_secret would print to the CI log.)
          # auth_type=azure-client-secret pins the auth source: the CLI will NOT fall
          # back to any cached user token if the SP creds are wrong — it errors instead.

      # --- Pre-hook: automated legacy-provision -> bind cutover (all projects) ---
      # Replaces the old input-driven Create + Bind steps. The Python pre-hook reads
      # every postgres_projects entry across resources/lakebase_*.yml and, for each:
      #   • creates the instance the legacy-provisioned way IF it doesn't exist
      #     (this is what unlocks Dual Networking), waits for AVAILABLE, then
      #   • binds the autoscaling keys it declares (project always; branch/endpoint
      #     only if declared; catalog only if it already exists).
      # If an instance already exists it's a no-op. No workflow inputs needed —
      # the bundle itself is the source of truth. Auth comes from the env vars above.
      # Use --only <project_id|key> to cut over a single value stream at a time.
      - name: Lakebase pre-hook (create-legacy + bind)
        run: |
          # Sanity-check the profile resolves AND that it authenticated as the SP —
          # not as a cached human user token. For a service principal, current-user
          # `userName` is the SP application (client) id; for a human it's an email.
          # We assert userName == client_id so a fallback-to-human auth fails loudly
          # instead of silently creating resources under a real user's name.
          ME_USERNAME="$(databricks current-user me --profile gh-actions -o json | python3 -c 'import sys,json; print(json.load(sys.stdin).get("userName",""))')"
          if [ -z "$ME_USERNAME" ]; then
            echo "::error::gh-actions profile did not authenticate. Check DATABRICKS_HOST / client_id / client_secret (or MSAL config) in the '${{ inputs.target }}' GitHub Environment."
            exit 1
          fi
          if [ "$ME_USERNAME" != "${{ secrets.DATABRICKS_CLIENT_ID }}" ]; then
            echo "::error::gh-actions authenticated as '$ME_USERNAME', not the expected service principal (client_id). Refusing to run as a fallback/human identity."
            exit 1
          fi
          echo "[auth] verified running as service principal $ME_USERNAME"
          python3 scripts/lakebase_prehook.py --target "${{ inputs.target }}" --profile gh-actions

      # --- ALWAYS runs: reconciles the bundle (catalogs, synced tables, jobs) ---
      - name: Validate
        run: databricks bundle validate -t "${{ inputs.target }}" --profile gh-actions
      - name: Deploy
        run: databricks bundle deploy -t "${{ inputs.target }}" --auto-approve --profile gh-actions

      # --- POST-deploy: admin grants + data-plane grants -------------------------
      # NOTE: autoscale is deliberately NOT set here. It is not managed by DABs, and
      # re-applying it every deploy would clobber a window a group/developer set manually
      # for a heavy workload. Autoscale is the value stream's own operational knob — set
      # it out-of-band with `lakebase_prehook.py --phase post --set-autoscale ...`.
      - name: Grant admin + data-plane access (post-deploy)
        run: |
          # Admin group only. Per-developer UC grants are intentionally NOT wired here
          # (2026-08-05): a developer may not — and often should not — have access to
          # every value stream's UC. Deferred pending a client conversation on the
          # developer-access model. The prehook still accepts --developer (defaults to
          # empty = skip); re-add it here once that model is agreed.
          #
          # --admin-group: SH_ENTERPRISE_ADMIN gets CAN_MANAGE + catalog ALL_PRIVILEGES +
          # databricks_superuser (+ createdb/createrole/bypassrls) across all projects.
          # --grant-data-access: derive Postgres data-plane grants from each project's
          # permissions: block and run setup_data_role per (principal x database) —
          # SERVICE_PRINCIPAL -> read+write, USER/GROUP -> read-only. The deployer/owner
          # (this SP) is auto-skipped (already databricks_superuser). Idempotent.
          python3 scripts/lakebase_prehook.py --phase post --target "${{ inputs.target }}" \
            --admin-group SH_ENTERPRISE_ADMIN --grant-data-access --profile gh-actions

      # NOTE: admin-group databricks_superuser (Postgres data-plane) is now granted by the
      # post-deploy step above (prehook --admin-group -> grant_admin_superuser, via the
      # postgres role API). The old standalone superuser step + setup_lakebase_superuser
      # job were removed — raw SQL GRANT databricks_superuser can't work from a customer
      # session (no ADMIN OPTION), so the role-API path replaced them.

      # --- Grant the Data API SP its Postgres role -------------------------------
      # Gated on run_data_api_grants because it has a MANUAL prerequisite: you must
      # click "Enable Data API" on the instance in the UI first — that creates the
      # `authenticator` role the grant depends on (no API to enable it).
      #
      # The pre-hook (--grant-dataapi) wires each project's SERVICE_PRINCIPAL(s) from the
      # `permissions:` block into the Data API (GRANT <sp> TO authenticator + DML), passing
      # the SP id directly — no secret scope. TARGETING: because Enable-Data-API is manual
      # and per-instance, pass data_api_project_id to do JUST that project via --only.
      # Leave it blank to process every project in the bundle (only safe once Data API is
      # enabled on all of them).
      - name: Grant Data API role
        if: ${{ inputs.run_data_api_grants }}
        run: |
          ONLY_ARG=""
          if [ -n "${{ inputs.data_api_project_id }}" ]; then
            ONLY_ARG="--only ${{ inputs.data_api_project_id }}"
          fi
          python3 scripts/lakebase_prehook.py --phase post --target "${{ inputs.target }}" \
            --grant-dataapi --admin-group '' $ONLY_ARG --profile gh-actions
