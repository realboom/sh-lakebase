name: Databricks DABs CI/CD

# Model:
#   - Pull request  -> validate dev (cheap, safe; no deploy). Developers deploy `dev`
#     locally as themselves (`databricks bundle deploy -t dev`). CI does not deploy dev
#     (mode:development is per-user; CI's SP has no /Workspace/Users/<sp> home).
#   - Merge to main -> deploy `prod` (CI authenticates AS the prod deploy SP).
#   - Manual dispatch -> onboard / update a Lakebase instance, with a CONDITIONAL
#     "create new provisioned instance" step (see the onboard-lakebase job).
#
# Auth: OAuth M2M (service principal). Per-environment GitHub Environments hold creds:
#   vars:    DATABRICKS_HOST
#   secrets: DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET
# Create the SPs with scripts/bootstrap_identity.sh and put their client id/secret here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual trigger. Provisioning/create/bind is now automatic (the Python pre-hook
  # reads every project from resources/lakebase_*.yml), so no instance/capacity
  # inputs are needed. Only two knobs remain:
  workflow_dispatch:
    inputs:
      target:
        description: "DABs target"
        type: choice
        options: [dev, prod]
        default: dev
      run_data_api_grants:
        description: "Run Data API role grants for all projects/databases? (check ONLY after you have manually clicked 'Enable Data API' on each instance in the UI — that step creates the authenticator role the grants need)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ---- PR safety gate: validate dev only ----
  validate-dev:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    environment: dev
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev

  # ---- Merge to main: auto-deploy prod (steady state; NO create/bind) ----
  # DISABLED 2026-07-25: no live prod workspace yet (the FEVM prod host is down and
  # the prod GitHub env creds are stale), so this fired red on every merge. Re-enable
  # once the `prod` GitHub environment points at a stable workspace with fresh SP creds.
  # deploy-prod:
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   runs-on: self-hosted
  #   environment: prod               # add required reviewers on this env to gate prod
  #   concurrency: deploy-prod
  #   env:
  #     DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  #     DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  #     DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: databricks/setup-cli@main
  #     - name: Validate prod
  #       run: databricks bundle validate -t prod
  #     - name: Deploy prod
  #       run: databricks bundle deploy -t prod

  # ---- Manual: onboard + reconcile all Lakebase value streams ----
  # The Python pre-hook auto-creates/binds any missing instance (from every
  # resources/lakebase_*.yml), deploy reconciles catalogs/synced tables/jobs, then
  # the post phase sets autoscale. Data API grants run only if the box is checked.
  onboard-lakebase:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: ${{ inputs.target }}   # binds creds + (for prod) approval gate to the chosen target
    concurrency: onboard-${{ inputs.target }}
    # NOTE: NO job-level DATABRICKS_* env block. Auth is done entirely through the
    # `gh-actions` profile written below — env vars would OVERRIDE the profile
    # (env wins over .databrickscfg) and cause silent auth-source confusion.
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main

      # --- Auth: write the `gh-actions` CLI profile ---
      # Every step below authenticates with `--profile gh-actions`. Only the auth
      # LINES below differ between environments — the profile NAME stays `gh-actions`
      # so nothing downstream changes:
      #   • CLIENT (real): Managed Identity / MSAL — replace the client_id/secret
      #     lines with:   azure_client_id = ${{ vars.ARM_CLIENT_ID }}
      #                    azure_use_msi   = true
      #   • THIS (test):  OAuth M2M service principal (client id + secret), since
      #     MSAL/managed-identity can't be reproduced on this workspace's tenant.
      - name: Set up Databricks CLI authentication (OAuth M2M service principal)
        shell: bash
        run: |
          mkdir -p ~/.databricks
          cat > ~/.databrickscfg <<EOF
          [gh-actions]
          host          = ${{ vars.DATABRICKS_HOST }}
          client_id     = ${{ vars.DATABRICKS_CLIENT_ID }}
          client_secret = ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          EOF
          # (Do NOT `cat` the file — client_secret would print to the CI log.)

      # --- Pre-hook: automated legacy-provision -> bind cutover (all projects) ---
      # Replaces the old input-driven Create + Bind steps. The Python pre-hook reads
      # every postgres_projects entry across resources/lakebase_*.yml and, for each:
      #   • creates the instance the legacy-provisioned way IF it doesn't exist
      #     (this is what unlocks Dual Networking), waits for AVAILABLE, then
      #   • binds the autoscaling keys it declares (project always; branch/endpoint
      #     only if declared; catalog only if it already exists).
      # If an instance already exists it's a no-op. No workflow inputs needed —
      # the bundle itself is the source of truth. Auth comes from the env vars above.
      # Use --only <project_id|key> to cut over a single value stream at a time.
      - name: Lakebase pre-hook (create-legacy + bind)
        run: |
          # Sanity-check the profile resolves (host comes from the gh-actions profile,
          # not an env var). Fails fast with a clear message if auth didn't get written.
          if ! databricks current-user me --profile gh-actions >/dev/null 2>&1; then
            echo "::error::gh-actions profile did not authenticate. Check DATABRICKS_HOST / client_id / client_secret (or MSAL config) in the '${{ inputs.target }}' GitHub Environment."
            exit 1
          fi
          python3 scripts/lakebase_prehook.py --target "${{ inputs.target }}" --profile gh-actions

      # --- ALWAYS runs: reconciles the bundle (catalogs, synced tables, jobs) ---
      - name: Validate
        run: databricks bundle validate -t "${{ inputs.target }}" --profile gh-actions
      - name: Deploy
        run: databricks bundle deploy -t "${{ inputs.target }}" --auto-approve --profile gh-actions

      # --- POST-deploy: set the 0.5->2 CU autoscale window on each project's endpoint ---
      # DABs can't set this on an auto-created primary, so the pre-hook does it via the
      # native `databricks postgres update-endpoint` CLI (no token-mint/curl needed).
      # Runs for ALL projects in the bundle, on the production/primary endpoint (or any
      # declared postgres_endpoints). Non-fatal per endpoint so one failure won't abort.
      - name: Set autoscale window (post-deploy)
        run: |
          python3 scripts/lakebase_prehook.py --phase post --target "${{ inputs.target }}" \
            --min-cu 0.5 --max-cu 2.0 --suspend-timeout 300s \
            --admin-group SH_ENTERPRISE_ADMIN --profile gh-actions

      # --- Grant the Data API SP its Postgres role (all projects x all databases) ---
      # Gated on run_data_api_grants because it has a MANUAL prerequisite: you must
      # click "Enable Data API" on each instance in the UI first — that creates the
      # `authenticator` role the grant depends on (no API to enable it).
      # No instance_name/database inputs: we enumerate every (project_id, database)
      # pair from the bundle (postgres_catalogs.postgres_database across all
      # resources/lakebase_*.yml) and run the shared setup_dataapi_role job per pair.
      # The notebook stays "grant one project + one database"; the loop lives here.
      - name: Grant Data API role
        if: ${{ inputs.run_data_api_grants }}
        run: |
          # Scope + client-id key are DERIVED (developer provides neither):
          #   scope          = kv-sh-ent-dpa-<target>              (same for every stream, per env)
          #   client_id_key  = sp-<value_stream>-dbrk-client-id    (per stream, from the value_stream tag)
          SCOPE="kv-sh-ent-dpa-${{ inputs.target }}"
          # Enumerate (project_id | database | client_id_key) from the resolved bundle.
          databricks bundle validate -t "${{ inputs.target }}" -o json --profile gh-actions > /tmp/bundle.json 2>/dev/null || true
          mapfile -t ROWS < <(python3 - <<'PY'
          import json, re
          cfg = json.load(open("/tmp/bundle.json"))
          variables = cfg.get("variables", {})
          def rv(s):
              return re.sub(r"\$\{var\.([A-Za-z_]\w*)\}",
                            lambda m: str(variables.get(m.group(1),{}).get("value",
                                          variables.get(m.group(1),{}).get("default",""))), s)
          res = cfg.get("resources", {})
          # project key -> (project_id, value_stream from custom_tags)
          projects = {}
          for k, v in res.get("postgres_projects", {}).items():
              vs = ""
              for t in (v.get("custom_tags") or []):
                  if t.get("key") == "value_stream":
                      vs = str(t.get("value", "")); break
              projects[k] = (rv(str(v["project_id"])), vs)
          seen = set()
          for c in res.get("postgres_catalogs", {}).values():
              pk = re.search(r"postgres_projects\.([^.}]+)\.", str(c.get("branch", "")))
              db = c.get("postgres_database")
              if pk and db and pk.group(1) in projects:
                  pid, vs = projects[pk.group(1)]
                  if not vs:
                      continue  # no value_stream tag -> can't derive the key; skip
                  key = f"sp-{vs}-dbrk-client-id"
                  row = (pid, db, key)
                  if row not in seen:
                      seen.add(row); print(f"{pid}|{db}|{key}")
          PY
          )
          if [ ${#ROWS[@]} -eq 0 ]; then
            echo "::warning::no (project,database,value_stream) rows found — nothing to grant."
          fi
          for row in "${ROWS[@]}"; do
            INST="${row%%|*}"; REST="${row#*|}"; DB="${REST%%|*}"; KEY="${REST##*|}"
            echo "Granting Data API role for project_id=$INST database=$DB scope=$SCOPE client_id_key=$KEY"
            databricks bundle run setup_dataapi_role -t "${{ inputs.target }}" \
              --params "project_id=$INST,database=$DB,secret_scope=$SCOPE,client_id_key=$KEY" --profile gh-actions
          done
